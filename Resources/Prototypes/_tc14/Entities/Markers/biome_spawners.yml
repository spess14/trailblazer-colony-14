- type: entity
  name: random overworld misc spawner
  id: OverworldMiscSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - sprite: Objects/Tools/rock.rsi
      state: "rock"
  - type: EntityTableSpawner
    table: !type:AllSelector
      children:
      - !type:GroupSelector
        children:
        - id: RockItem1
        - id: BushForage
      - !type:GroupSelector
        prob: 0.5
        children:
        - id: SalvageSpawnerScrapCommon
      - !type:GroupSelector
        prob: 0.05
        children:
        - id: SpawnMobCow
        - id: SpawnMobCatGeneric
        - id: SpawnMobGoat
        - id: SpawnMobMonkey
        - id: SpawnMobMouse
        - id: SpawnMobScurret
        - id: SpawnMobReindeerBuck
        - id: SpawnMobReindeerDoe

- type: entityTable
  id: SalvageScrapOverworld
  table: !type:GroupSelector
    children:
    # scrap. do not add treasure scrap from vanilla loottables, since a bunch of items from there are kinda useless
    - !type:GroupSelector
      children:
      - !type:NestedSelector
        tableId: SalvageScrapLowValue
        weight: 60
      - !type:NestedSelector
        tableId: SalvageScrapHighValue
        weight: 30
      - !type:NestedSelector
        tableId: SalvageScrapLarge
        weight: 10
