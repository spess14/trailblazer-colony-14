- type: entity
  id: PortableGeneratorCPacmanMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: C.P.A.C.M.A.N.-type portable generator machine board
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: PortableGeneratorCPacman
    stackRequirements:
      Steel: 2
      Cable: 5
  - type: PhysicalComposition
    materialComposition:
      Glass: 200
    chemicalComposition:
      Silicon: 20
  - type: StaticPrice
    price: 40

- type: entity
  id: SeedSplicerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: seed splicer machine board
  description: A machine printed circuit board for a seed splicer.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: SeedSplicer
    stackRequirements:
      Capacitor: 1
      # replacing the console screen
      Glass: 1
      Cable: 2
