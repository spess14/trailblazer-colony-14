- type: entity
  id: SeedSplicer
  name: seed splicer
  parent: [ BaseMachinePowered, ConstructibleMachine, BaseConstructibleMachineDestructible ]
  description: Combines seeds into a new type.
  components:
  - type: Sprite
    sprite: _tc14/Structures/Machines/seed_splicer.rsi
    snapCardinals: true
    layers:
    - state: seed-splicer-off
    - state: seed-splicer-unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Machine
    board: SeedExtractorMachineCircuitboard
  - type: ItemSlots
    slots:
      seed1:
        name: seedsplicer-seed1
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectOnBreak: true
        swap: false
        whitelist:
          components:
          - Seed
      seed2:
        name: seedsplicer-seed2
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectOnBreak: true
        swap: false
        whitelist:
          components:
          - Seed
  - type: SeedSplicer
  - type: ContainerContainer
    containers:
      board: !type:Container
      SeedSplicer-seed1: !type:ContainerSlot
      SeedSplicer-seed2: !type:ContainerSlot
